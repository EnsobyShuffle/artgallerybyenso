<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>收藏与笔记备份｜凝视</title>
<style>body{margin:0;background:#f8f7f3;color:#304032;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:660px;margin:48px auto;padding:0 24px}a{color:#405d45}h1{font-size:30px;font-weight:500}section{border-top:1px solid #d6ded0;margin-top:32px;padding-top:20px}button{padding:12px 20px;border-radius:24px;border:1px solid #76866b;background:#f8f7f3;color:#304032;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}p{font-size:14px}#preview,#status{white-space:pre-wrap;overflow-wrap:anywhere}input{max-width:100%;font:inherit;margin:12px 0}small{color:#61715c}</style>
</head><body><main><a href="/">← 返回画廊</a><h1>带走你的收藏与笔记</h1>
<p>换网址前，在原网址导出备份；到新网址后，再导入同一个文件。备份只在当前浏览器处理，不会上传到服务器。</p><p id="summary"></p>
<section><h2>导出当前浏览器的数据</h2><button id="export" type="button">下载备份文件</button><p>备份里含有你的私人笔记，请保存在自己的设备上。</p></section>
<section><h2>导入已有备份</h2><label for="file">选择画廊备份文件</label><br><input id="file" type="file" accept="application/json,.json"><p id="preview"></p><button id="import" type="button" disabled>合并到当前浏览器</button><p>收藏会合并。同一作品已有不同笔记时，会保留当前笔记；备份文件中的版本不会被删除，请保留原文件供对照。</p></section>
<p id="status" role="status" aria-live="polite"></p><small>完成后重新打开画廊，查看收藏和笔记。</small>
</main><script src="/personal-data-core.js"></script><script src="/personal-data.js"></script></body></html>

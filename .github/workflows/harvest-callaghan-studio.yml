name: Harvest George Callaghan studio artworks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[callaghan harvest]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract painting title, medium, image and lot provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,html,re,json
          from html.parser import HTMLParser
          class P(HTMLParser):
            def __init__(self):super().__init__();self.inlot=False;self.in_title=False;self.in_medium=False;self.cur=None;self.items=[];self.href=None
            def handle_starttag(self,tag,attrs):
              a=dict(attrs);cl=a.get('class','')
              if tag=='div' and 'lot-outer' in cl:
                if self.cur and self.cur.get('title'):self.items.append(self.cur)
                self.cur={'title':'','medium':'','image':None,'url':None};self.inlot=True
              if not self.cur:return
              if tag=='h3' and 'lot-title' in cl:self.in_title=True
              if tag=='span' and self.inlot and not self.cur['medium']:self.in_medium=True
              if tag=='img' and not self.cur['image'] and a.get('src','').startswith('/art2/'):self.cur['image']=urllib.parse.urljoin('https://www.rosss.com',a['src'])
              if tag=='a' and '/lot-details/george-callaghan/' in a.get('href','') and not self.cur['url']:self.cur['url']=urllib.parse.urljoin('https://www.rosss.com',a['href'])
            def handle_data(self,txt):
              if self.cur and self.in_title:self.cur['title']+=txt
              if self.cur and self.in_medium and 'Medium:' in txt:self.cur['medium']=txt.strip()
            def handle_endtag(self,tag):
              if tag=='h3':self.in_title=False
              if tag=='span':self.in_medium=False
            def finish(self):
              if self.cur and self.cur.get('title'):self.items.append(self.cur)
          for offset in range(5):
            url='https://www.rosss.com/auction/george-callaghan-studio-sale/170/?offset='+str(offset)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'})
              with urllib.request.urlopen(req,timeout=20) as r:body=r.read().decode('utf-8','replace')
              p=P();p.feed(body);p.finish()
              rows=[]
              seen=set()
              for x in p.items:
                t=html.unescape(x.get('title','')).strip().strip("'\"").upper()
                if t and x['image'] and x['url'] and x['image'] not in seen:
                  seen.add(x['image']);rows.append({**x,'title':t})
              print('PAGE',offset,'FOUND',len(rows),'HTML_BYTES',len(body),flush=True)
              for x in rows[:70]:print('GEORGE',json.dumps(x,ensure_ascii=False),flush=True)
            except Exception as e:print('ERROR',offset,repr(e),flush=True)
          PY

name: Test public artist links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test six public artist links and live HTML
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://artgallerybyenso.netlify.app/"
          for ID in evans jef journaia levitan menne callaghan; do
            URL="${BASE}?artist=${ID}"
            STATUS=$(curl -L --silent --show-error --max-time 20 -w '%{http_code}' -o /tmp/gallery-direct.html "$URL")
            test "$STATUS" = "200"
            grep -q 'id="galleryData"' /tmp/gallery-direct.html
            grep -q "\"$ID\"" /tmp/gallery-direct.html
            echo "PASS: ${URL} (HTTP ${STATUS})"
          done

name: Validate staged 50-artwork candidates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-candidates:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify candidate images]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check 111 unique artwork URLs against image content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from concurrent.futures import ThreadPoolExecutor
          import json,time,collections
          j=json.loads(Path('research/remaining-artists-50-candidates.json').read_text())
          xs=j['records']
          assert len(xs)==111 and len({x['id'] for x in xs})==111
          print('STAGED',dict(collections.Counter(x['artist'] for x in xs)),flush=True)
          def probe(x):
            msg=''
            for attempt in range(3):
              try:
                req=Request(x['image'],headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Range':'bytes=0-2047','Accept':'image/avif,image/webp,image/*,*/*;q=0.8'})
                with urlopen(req,timeout=16) as r:
                  ctype=r.headers.get('content-type','')
                  contents=r.read(128)
                  if not ctype.lower().startswith('image/') or not contents:return (x['artist'],x['id'],'BAD_CONTENT',ctype)
                  return (x['artist'],x['id'],'OK',str(r.status)+' '+ctype)
              except Exception as e:
                msg=str(e)[:120]
                if any(v in msg for v in ('429','503','502')) and attempt<2:
                  time.sleep((attempt+1)*3)
                  continue
                return (x['artist'],x['id'],'FAILED',msg)
          with ThreadPoolExecutor(max_workers=5) as pool:
            out=list(pool.map(probe,xs))
          ok=collections.Counter(x[0] for x in out if x[2]=='OK')
          fail=collections.Counter(x[0] for x in out if x[2]!='OK')
          print('RESULT_OK',dict(ok),flush=True)
          print('RESULT_FAIL',dict(fail),flush=True)
          for x in out:
            if x[2]!='OK': print('IMAGE_FAILED',json.dumps(x,ensure_ascii=False),flush=True)
          if sum(fail.values())>0:raise SystemExit(1)
          print('SUCCESS all 111 new images accessible',flush=True)
          PY

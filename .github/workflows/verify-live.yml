name: Verify the published art gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip netlify]') || contains(github.event.head_commit.message, '[verify live]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the published source
        uses: actions/checkout@v4
      - name: Identify difference between source and live HTML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://artgallerybyenso.netlify.app/index.html?verify=${GITHUB_SHA}" -o /tmp/live.html
          python3 - <<'PY'
          from pathlib import Path
          a = Path('index.html').read_bytes()
          b = Path('/tmp/live.html').read_bytes()
          p = 0
          while p < min(len(a), len(b)) and a[p] == b[p]:
              p += 1
          s = 0
          while s < min(len(a), len(b)) - p and a[-1-s] == b[-1-s]:
              s += 1
          print('source_bytes=', len(a), 'live_bytes=', len(b))
          print('first_diff_byte=', p, 'common_suffix=', s)
          print('source_diff_repr=', repr(a[p:len(a)-s][:600]))
          print('live_diff_repr=', repr(b[p:len(b)-s][:900]))
          print('source_remainder_bytes=', len(a)-s-p)
          print('live_remainder_bytes=', len(b)-s-p)
          print('same_source_except_one_insertion=', b[:p] + b[len(b)-s:] == a if s else b[:p] == a)
          print('live_has_levitan=', b'Isaac Levitan' in b)
          PY

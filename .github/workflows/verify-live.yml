name: Verify the published art gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip netlify]') || contains(github.event.head_commit.message, '[verify live]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the published source
        uses: actions/checkout@v4
      - name: Diagnose live version
        shell: bash
        run: |
          set -euo pipefail
          URL="https://artgallerybyenso.netlify.app/index.html?verify=${GITHUB_SHA}"
          echo "EXPECTED SHA256:"
          sha256sum index.html
          echo "EXPECTED title:"
          grep -o '<title>[^<]*</title>' index.html | head -1
          echo "Fetching live page"
          curl --fail --silent --show-error --location --max-time 20 "$URL" -o /tmp/live.html
          echo "LIVE HTTP FILE SHA256:"
          sha256sum /tmp/live.html
          echo "LIVE title:"
          grep -o '<title>[^<]*</title>' /tmp/live.html | head -1 || true
          echo "LIVE filesize:"
          wc -c /tmp/live.html
          echo "LIVE includes Isaac Levitan?"
          if grep -q 'Isaac Levitan' /tmp/live.html; then echo YES; else echo NO; fi
          echo "LIVE includes artist collection homepage?"
          if grep -q '艺术家收藏馆' /tmp/live.html; then echo YES; else echo NO; fi
          if cmp -s index.html /tmp/live.html; then
            echo "SUCCESS: live Netlify file matches GitHub exactly."
          else
            echo "MISMATCH: live Netlify file differs from GitHub."
            exit 1
          fi

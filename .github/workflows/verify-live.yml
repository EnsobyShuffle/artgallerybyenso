name: Verify the published art gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip netlify]') || contains(github.event.head_commit.message, '[verify live]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the published source
        uses: actions/checkout@v4
      - name: Verify Netlify serves the GitHub index.html
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path

          expected = Path("index.html").read_bytes()
          url = "https://artgallerybyenso.netlify.app/index.html?verify=" + os.environ["GITHUB_SHA"]
          netlify_comment_start = b"\n<!-- This site is hosted on Netlify."

          for attempt in range(1, 13):
              response = subprocess.run(
                  ["curl", "--fail", "--silent", "--show-error", "--location", "--max-time", "20", url],
                  capture_output=True,
              )
              if response.returncode == 0:
                  live = response.stdout
                  if live == expected:
                      print("SUCCESS: Netlify serves exactly the GitHub index.html.", flush=True)
                      sys.exit(0)

                  # Netlify injects a hosting-info HTML comment. Ignore ONLY that
                  # one extra comment; all actual page content must match byte-for-byte.
                  start = live.find(netlify_comment_start)
                  if 0 <= start < 1024:
                      end = live.find(b"-->", start)
                      if end != -1:
                          without_netlify_comment = live[:start] + live[end+3:]
                          if without_netlify_comment == expected:
                              print("SUCCESS: Netlify serves the exact GitHub HTML, with only its injected hosting comment.", flush=True)
                              sys.exit(0)
                  print(f"Attempt {attempt}/12: site reachable, version still differs.", flush=True)
              else:
                  print(f"Attempt {attempt}/12: site not accessible ({response.returncode}).", flush=True)

              if attempt < 12:
                  time.sleep(10)

          print("FAILED: production site does not match this GitHub version.", flush=True)
          sys.exit(1)
          PY

name: Verify the published art gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip netlify]') || contains(github.event.head_commit.message, '[verify live]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the published source
        uses: actions/checkout@v4
      - name: Compare live HTML with this GitHub commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(sha256sum index.html | cut -d' ' -f1)"
          SITE_URL="https://artgallerybyenso.netlify.app/index.html?release=${GITHUB_SHA}"
          for attempt in $(seq 1 12); do
            echo "Checking live website, attempt ${attempt}/12"
            if curl --fail --silent --show-error --location --max-time 20 "${SITE_URL}" -o /tmp/live-gallery.html; then
              ACTUAL="$(sha256sum /tmp/live-gallery.html | cut -d' ' -f1)"
              if [[ "${EXPECTED}" == "${ACTUAL}" ]]; then
                echo "SUCCESS: Netlify is serving the exact index.html from GitHub."
                echo "Verified commit: ${GITHUB_SHA}"
                echo "Live URL: https://artgallerybyenso.netlify.app/"
                exit 0
              fi
              echo "Live site accessible, but published HTML does not yet match GitHub."
            else
              echo "Live website not accessible on this attempt."
            fi
            sleep 10
          done
          echo "FAILED: Could not verify that Netlify is serving this version."
          exit 1

name: Research George Callaghan studio sale artwork images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ross research]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect auction artwork thumbnails and links
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen,Request
          import re,html,json
          u='https://www.rosss.com/auction/george-callaghan-studio-sale/170/'
          try:
            with urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36','Accept':'text/html'}),timeout=25) as r: raw=r.read().decode('utf-8','replace')
            print('PAGE_SIZE',len(raw),flush=True)
            for term in ['A CHAT ON THE BRIDGE','THE ALL BAR NUN','THE FIDDLER','Lot 1','209 item']:
              i=raw.find(term)
              print('TERM',term,'POS',i,'CONTEXT',raw[max(0,i-1200):i+1000].replace('\n',' ')[:2200],flush=True)
            for v in re.findall(r'https?://[^"\s>]+\.(?:jpe?g|png|webp)',raw,re.I)[:15]:print('IMGURL',v[:350],flush=True)
          except Exception as e:print('ERROR',repr(e),flush=True)
          PY

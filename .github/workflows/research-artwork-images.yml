name: Research artwork image sources

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-source-image-references:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[artwork research]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read official galleries and report image metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          import html,json,re
          class Extractor(HTMLParser):
            def __init__(self):
              super().__init__(); self.images=[]; self.links=[]
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag=='img':
                self.images.append({k:d[k] for k in ('alt','src','data-src','data-image','srcset','loading') if d.get(k)})
              if tag=='a' and d.get('href') and ('paul-evans' in d.get('href','') or 'jefbourgeau' in d.get('href','')):
                self.links.append(d.get('href'))
          sources={
            'jef':'https://detroitmona.wixsite.com/artgarage/artwork',
            'evans':'https://aquarellepublishing.co.uk/paul-evans',
            'evans_gallery':'https://www.therosegallery.co.uk/collections/paul-evans-landscape-art',
          }
          for label,url in sources.items():
            try:
              req=Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'})
              with urlopen(req,timeout=25) as r: raw=r.read().decode('utf-8','replace')
              p=Extractor();p.feed(raw)
              print('SITE',label,'BYTES',len(raw),'IMG_TAGS',len(p.images),'LINKS',len(p.links),flush=True)
              seen=set();n=0
              for item in p.images:
                src=item.get('src') or item.get('data-src') or ''
                alt=html.unescape(item.get('alt',''))
                if not src or src.startswith('data:'):continue
                k=(alt,src.split('?')[0])
                if k in seen:continue
                seen.add(k)
                if n>=110:break
                if label=='jef' and 'wixstatic' not in src:continue
                if label.startswith('evans') and not any(term in src.lower() or term in alt.lower() for term in ('evans','pe3','paul','winter','summer','spring','moon','autumn','bluebell','frost','meadow','coast')): continue
                print('IMAGE_META',label,json.dumps({'alt':alt,'src':src},ensure_ascii=False),flush=True)
                n+=1
              print('SITE_SUMMARY',label,'IMAGE_OUTPUT',n,'PAGE_LINKS',len(p.links),flush=True)
            except Exception as e: print('SITE_ERROR',label,repr(e),flush=True)
          PY

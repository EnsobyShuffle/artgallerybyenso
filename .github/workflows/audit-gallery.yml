name: Audit the Art Gallery catalogue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out gallery
        uses: actions/checkout@v4
      - name: Validate artist data, preserved IDs and images
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, concurrent.futures, collections
          from pathlib import Path
          page=Path('index.html').read_text()
          m=re.search(r'<script type="application/json" id="galleryData">(.*?)</script>', page, re.S)
          assert m, "gallery data not found"
          d=json.loads(m.group(1))
          assert len(d['artists'])==7, "artist count wrong"
          expected={'evans','jef','journaia','levitan','menne','callaghan','duchamp'}
          assert set(d['artists'])==expected, "artist missing"
          assert len(d['pieces'])==len({w['id'] for w in d['pieces']}), "duplicate work IDs"
          counts=collections.Counter(w['artist'] for w in d['pieces'])
          assert counts['levitan']==18 and counts['menne']==7 and counts['callaghan']==7 and counts['duchamp']>=14, counts
          for a in expected:
              assert a in d['catalog'], "missing catalog for "+a
              assert d['artists'][a]['resources'], "missing sources for "+a
          assert 'menne:\'第五站\'' in page and 'callaghan:\'第六站\'' in page
          print("DATA OK", sorted(counts.items()), flush=True)
          targets={a: d['artists'][a]['cover'] for a in expected}
          for w in d['pieces']:
              if w['artist'] in ('menne','callaghan','levitan','duchamp'):
                  targets[w['id']]=w['image']
          def probe(item):
              key,url=item
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; ArtGalleryQA/1.0)','Range':'bytes=0-4095'})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      content=r.headers.get('content-type','')
                      first=r.read(256)
                      ok=('image/' in content.lower()) and bool(first)
                      return key,'OK' if ok else 'BAD_CONTENT',r.status,content
              except Exception as e:
                  return key,'BLOCKED_OR_FAIL',None,str(e)[:120]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              results=list(ex.map(probe,targets.items()))
          for x in results: print('IMAGE', *x, flush=True)
          fails=[x for x in results if x[1]!='OK']
          print(f"IMAGE AUDIT: {len(results)-len(fails)}/{len(results)} reachable; {len(fails)} blocked or missing.", flush=True)
          if fails:
              print("Some third-party image hosts may block hotlinking; these are warnings, not silently treated as passes.")
          PY
